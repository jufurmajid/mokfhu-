name: Build Clean Android FPS Base

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "restart/**"
    paths:
      - "game/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: clean-fps-base-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Android clean base APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor animated AK hands
        shell: bash
        run: |
          set -euo pipefail
          rm -rf game/vendor /tmp/fpsarms
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Ayush-Mohanty/FPS-Arms-3D.git /tmp/fpsarms
          git -C /tmp/fpsarms sparse-checkout set Models/fps_ak-74m_animations
          mkdir -p game/vendor/viewmodel
          cp /tmp/fpsarms/Models/fps_ak-74m_animations/scene.gltf game/vendor/viewmodel/scene.gltf
          cp /tmp/fpsarms/Models/fps_ak-74m_animations/scene.bin game/vendor/viewmodel/scene.bin
          cp -a /tmp/fpsarms/Models/fps_ak-74m_animations/textures game/vendor/viewmodel/textures
          cp /tmp/fpsarms/Models/fps_ak-74m_animations/license.txt game/vendor/viewmodel/LICENSE.txt
          test -s game/vendor/viewmodel/scene.gltf
          test -s game/vendor/viewmodel/scene.bin

      - name: Configure Android tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"
          if [ -d /usr/lib/android-sdk ]; then
            ANDROID_SDK="/usr/lib/android-sdk"
          elif [ -d /opt/android-sdk ]; then
            ANDROID_SDK="/opt/android-sdk"
          else
            echo "Android SDK not found"
            exit 1
          fi
          JAVA_BIN="$(readlink -f "$(command -v javac)")"
          JAVA_HOME_PATH="$(dirname "$(dirname "$JAVA_BIN")")"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          touch "$SETTINGS"
          echo "export/android/android_sdk_path = \"$ANDROID_SDK\"" >> "$SETTINGS"
          echo "export/android/java_sdk_path = \"$JAVA_HOME_PATH\"" >> "$SETTINGS"

      - name: Import project
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          timeout 10m godot --headless --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "ERROR:|SCRIPT ERROR|Parse Error|Error importing|Failed loading resource|MOKFHU_FATAL" /tmp/import.log; then
            exit 1
          fi

      - name: Validate clean milestone
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --audio-driver Dummy --script res://scripts/validate.gd --verbose 2>&1 | tee /tmp/validate.log
          if grep -E "ERROR:|SCRIPT ERROR|Parse Error|MOKFHU_FATAL|Failed loading resource" /tmp/validate.log; then
            exit 1
          fi
          grep -F -- "--- CLEAN FPS BASE VALIDATION PASSED ---" /tmp/validate.log

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cd game
          timeout 10m godot --headless --verbose --export-debug "Android Debug" "$(pwd)/../build/Mokfhu-clean-base-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mokfhu-Clean-Base-Android
          path: build/Mokfhu-clean-base-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    name: Publish clean preview APK
    if: github.ref == 'refs/heads/main'
    needs: android-debug
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: Mokfhu-Clean-Base-Android
          path: release-apk

      - name: Publish stable preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="release-apk/Mokfhu-clean-base-debug.apk"
          test -s "$APK"
          if gh release view clean-base-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload clean-base-preview "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create clean-base-preview "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mokfhu Clean FPS Base" \
              --notes "Milestone 1: player, AK hands, touch controls and wide procedural sand test floor."
          fi

env:
  GODOT_VERSION: "4.3"
