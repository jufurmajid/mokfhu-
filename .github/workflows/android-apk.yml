name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ai/realistic-rebuild
    paths:
      - "game/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor ready-made 3D assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf game/vendor game/level
          rm -rf /tmp/fpsarms /tmp/tps /tmp/storm

          git clone --depth 1 --filter=blob:none --sparse https://github.com/Ayush-Mohanty/FPS-Arms-3D.git /tmp/fpsarms
          git -C /tmp/fpsarms sparse-checkout set Models/fps_ak-74m_animations
          mkdir -p game/vendor/viewmodel
          cp /tmp/fpsarms/Models/fps_ak-74m_animations/scene.gltf game/vendor/viewmodel/scene.gltf
          cp /tmp/fpsarms/Models/fps_ak-74m_animations/scene.bin game/vendor/viewmodel/scene.bin
          cp -a /tmp/fpsarms/Models/fps_ak-74m_animations/textures game/vendor/viewmodel/textures
          cp /tmp/fpsarms/Models/fps_ak-74m_animations/license.txt game/vendor/viewmodel/LICENSE.txt

          git clone --depth 1 --filter=blob:none --sparse --branch 4.2-f0587b2 https://github.com/godotengine/tps-demo.git /tmp/tps
          git -C /tmp/tps sparse-checkout set level/geometry level/textures LICENSE.md
          mkdir -p game/level
          cp -a /tmp/tps/level/geometry game/level/geometry
          cp -a /tmp/tps/level/textures game/level/textures
          cp /tmp/tps/LICENSE.md game/level/TPS_DEMO_LICENSE.md

          git clone --depth 1 --filter=blob:none --sparse https://github.com/mars-tw/storm-apocalypse.git /tmp/storm
          git -C /tmp/storm sparse-checkout set public/models/custom/characters
          mkdir -p game/vendor/enemy
          cp /tmp/storm/public/models/custom/characters/protagonist-vet-sniper.glb game/vendor/enemy/enemy.glb
          git -C /tmp/storm show HEAD:LICENSE > game/vendor/enemy/LICENSE.txt

          test -s game/vendor/viewmodel/scene.gltf
          test -s game/vendor/viewmodel/scene.bin
          test -s game/vendor/enemy/enemy.glb
          test -s game/level/geometry/scenes/structure.tscn

      - name: Configure Godot Android tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"

          if [ -d /usr/lib/android-sdk ]; then
            ANDROID_SDK="/usr/lib/android-sdk"
          elif [ -d /opt/android-sdk ]; then
            ANDROID_SDK="/opt/android-sdk"
          else
            echo "Android SDK was not found in the Godot CI image."
            exit 1
          fi

          JAVA_BIN="$(readlink -f "$(command -v javac)")"
          JAVA_HOME_PATH="$(dirname "$(dirname "$JAVA_BIN")")"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          touch "$SETTINGS"
          echo "export/android/android_sdk_path = \"$ANDROID_SDK\"" >> "$SETTINGS"
          echo "export/android/java_sdk_path = \"$JAVA_HOME_PATH\"" >> "$SETTINGS"

      - name: Import project
        working-directory: game
        run: godot --headless --editor --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cd game
          godot --headless --verbose --export-debug "Android Debug" "$(pwd)/../build/Mokfhu-realistic-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mokfhu-Realistic-Android-debug
          path: build/Mokfhu-realistic-debug.apk
          if-no-files-found: error
          retention-days: 14

env:
  GODOT_VERSION: "4.3"
