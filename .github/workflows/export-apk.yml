name: Requested Android APK export

on:
  workflow_dispatch:

jobs:
  export-apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Create temporary debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Export APK with Godot 4.3
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./game
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true
          verbose: true

      - name: Stage exported APK
        shell: bash
        run: |
          mkdir -p game/builds/android
          cp "$HOME/.local/share/godot/builds/Android/Mokfhu.apk" game/builds/android/Mokfhu.apk
          test -s game/builds/android/Mokfhu.apk

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create mokfhu-android-20261004 game/builds/android/Mokfhu.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mokfhu Android APK" --notes "Android ARM64 debug build of Mokfhu."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mokfhu-Android-APK
          path: game/builds/android/Mokfhu.apk
          if-no-files-found: error
          retention-days: 7
