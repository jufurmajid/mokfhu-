name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ai/realistic-rebuild
    paths:
      - "game/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: realistic-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor ready-made 3D assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf game/vendor game/level
          rm -rf /tmp/fpsarms

          # Ready-made animated first-person AK + hands. Keep this rig unchanged:
          # its reload/shoot animations are already working well in the game.
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Ayush-Mohanty/FPS-Arms-3D.git /tmp/fpsarms
          git -C /tmp/fpsarms sparse-checkout set Models/fps_ak-74m_animations
          mkdir -p game/vendor/viewmodel
          cp /tmp/fpsarms/Models/fps_ak-74m_animations/scene.gltf game/vendor/viewmodel/scene.gltf
          cp /tmp/fpsarms/Models/fps_ak-74m_animations/scene.bin game/vendor/viewmodel/scene.bin
          cp -a /tmp/fpsarms/Models/fps_ak-74m_animations/textures game/vendor/viewmodel/textures
          cp /tmp/fpsarms/Models/fps_ak-74m_animations/license.txt game/vendor/viewmodel/LICENSE.txt

          # Download only a few tiny CC0 GLB assets for the compact desert arena
          # and two realistic tactical enemy poses. This replaces the former large
          # industrial level and its expensive runtime trimesh collisions.
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq python3 ca-certificates
          fi
          mkdir -p game/vendor/desert game/vendor/enemy
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import shutil

          assets = {
              "https://cdn.3dassets.dev/assets/38107/v1/model.glb": "game/vendor/desert/ground_light.glb",
              "https://cdn.3dassets.dev/assets/38108/v1/model.glb": "game/vendor/desert/ground_dark.glb",
              "https://cdn.3dassets.dev/assets/38109/v1/model.glb": "game/vendor/desert/sand_drift.glb",
              "https://cdn.3dassets.dev/assets/133/v1/model.glb": "game/vendor/desert/rock_outcrop.glb",
              "https://cdn.3dassets.dev/assets/27567/v1/model.glb": "game/vendor/enemy/assault_aim.glb",
              "https://cdn.3dassets.dev/assets/27569/v1/model.glb": "game/vendor/enemy/assault_run.glb",
          }
          for url, output in assets.items():
              path = Path(output)
              path.parent.mkdir(parents=True, exist_ok=True)
              request = Request(url, headers={"User-Agent": "Mokfhu-Godot-Build/1.0"})
              with urlopen(request, timeout=90) as response, path.open("wb") as dst:
                  shutil.copyfileobj(response, dst)
              if path.stat().st_size < 1024:
                  raise RuntimeError(f"Downloaded asset is unexpectedly small: {url}")
              print(f"Downloaded {path} ({path.stat().st_size} bytes)")
          PY

          test -s game/vendor/viewmodel/scene.gltf
          test -s game/vendor/viewmodel/scene.bin
          test -s game/vendor/desert/ground_light.glb
          test -s game/vendor/desert/ground_dark.glb
          test -s game/vendor/desert/sand_drift.glb
          test -s game/vendor/desert/rock_outcrop.glb
          test -s game/vendor/enemy/assault_aim.glb
          test -s game/vendor/enemy/assault_run.glb
          du -sh game || true

      - name: Configure Godot Android tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"

          if [ -d /usr/lib/android-sdk ]; then
            ANDROID_SDK="/usr/lib/android-sdk"
          elif [ -d /opt/android-sdk ]; then
            ANDROID_SDK="/opt/android-sdk"
          else
            echo "Android SDK was not found in the Godot CI image."
            exit 1
          fi

          JAVA_BIN="$(readlink -f "$(command -v javac)")"
          JAVA_HOME_PATH="$(dirname "$(dirname "$JAVA_BIN")")"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          touch "$SETTINGS"
          echo "export/android/android_sdk_path = \"$ANDROID_SDK\"" >> "$SETTINGS"
          echo "export/android/java_sdk_path = \"$JAVA_HOME_PATH\"" >> "$SETTINGS"

      - name: Import project
        working-directory: game
        shell: bash
        run: timeout 12m godot --headless --editor --quit

      - name: Runtime smoke test
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --quit-after 120 --verbose 2>&1 | tee /tmp/mokfhu-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|Attempt to call" /tmp/mokfhu-smoke.log; then
            echo "Runtime script error detected."
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cd game
          timeout 10m godot --headless --verbose --export-debug "Android Debug" "$(pwd)/../build/Mokfhu-realistic-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mokfhu-Realistic-Android-debug
          path: build/Mokfhu-realistic-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    name: Publish external preview APK
    if: github.ref == 'refs/heads/main'
    needs: android-debug
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: Mokfhu-Realistic-Android-debug
          path: release-apk

      - name: Publish stable preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="release-apk/Mokfhu-realistic-debug.apk"
          test -s "$APK"
          if gh release view realistic-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload realistic-preview "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create realistic-preview "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mokfhu Realistic Preview" \
              --notes "Automated Android preview. This APK passed Godot import, runtime smoke test, and Android export."
          fi

env:
  GODOT_VERSION: "4.3"
